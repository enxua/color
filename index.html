<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Palette Generator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="palette-container" id="palette">
        <!-- Color columns will be generated here -->
    </div>

    <div class="controls">
        <button id="generate-btn" class="main-btn">Generate New Palette (Space)</button>
        <p class="hint">Press Space to generate, Click color to copy, Click Icon to lock</p>
    </div>

    <div id="toast" class="toast">Copied to clipboard!</div>

    <script src="main.js" type="module"></script>
</body>
</html>
