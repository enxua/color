<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-J1C3428MR5"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-J1C3428MR5');
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Matcher - Browse Palettes</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-top" style="justify-content: space-between; align-items: center;">
                <div style="display: flex; align-items: center; gap: 2rem;">
                    <!-- Logo -->
                    <a href="index.html" style="text-decoration: none; color: var(--text-color); font-weight: 800; font-size: 1.5rem; letter-spacing: -0.03em;">
                        Color Matcher
                    </a>
                    
                    <!-- Navigation -->
                    <nav class="main-nav" style="margin: 0;">
                        <a href="index.html" class="nav-link active" data-i18n="navBrowse">Default Color</a>
                        <a href="matching.html" class="nav-link" data-i18n="navHome">Make Color</a>
                    </nav>
                </div>

                <div style="display: flex; gap: 1rem; align-items: center;">
                    <select id="lang-select" class="lang-select" aria-label="Select Language">
                        <option value="en">English</option>
                        <option value="es">Español</option>
                        <option value="fr">Français</option>
                        <option value="it">Italiano</option>
                        <option value="pt">Português</option>
                        <option value="de">Deutsch</option>
                        <option value="ko">한국어</option>
                        <option value="ja">日本語</option>
                        <option value="zh-CN">简体中文</option>
                        <option value="zh-TW">繁體中文</option>
                    </select>
                    <button id="theme-toggle" class="theme-btn" aria-label="Toggle Dark Mode">
                        <!-- Icon injected by JS -->
                    </button>
                </div>
            </div>
            
            <div class="header-content" style="margin-top: 3rem; text-align: center;">
                <h1 data-i18n="browseTitle" style="font-size: 2.5rem; margin-bottom: 0.5rem; letter-spacing: -0.05em;">Browse Color Palettes</h1>
                <p class="subtitle" data-i18n="browseSubtitle" style="font-size: 1.1rem; opacity: 0.8;">Discover beautiful color combinations</p>
            </div>
        </div>
    </header>

    <main class="container">
        <div id="view-browse" class="view-section" style="margin-top: 2rem;">
            <div id="browse-grid" class="color-grid">
                <!-- Browse cards will be injected here -->
            </div>
        </div>
    </main>

    <footer style="margin-top: 4rem; padding: 2rem 0; border-top: 1px solid var(--border-color); text-align: center;">
        <div class="container">
            <p style="margin-bottom: 1rem;">&copy; 2026 Color Matcher. All rights reserved.</p>
        </div>
    </footer>

    <div id="toast" class="toast">Copied to clipboard!</div>
    <script src="main.js?v=3" type="module"></script>
</body>
</html>
