<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Matcher</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-top">
                <select id="lang-select" class="lang-select" aria-label="Select Language">
                    <option value="en">English</option>
                    <option value="de">Deutsch</option>
                    <option value="es">Español</option>
                    <option value="fr">Français</option>
                    <option value="it">Italiano</option>
                    <option value="pt">Português</option>
                    <option value="ko">한국어</option>
                    <option value="ja">日本語</option>
                    <option value="zh-CN">简体中文</option>
                    <option value="zh-TW">繁體中文</option>
                </select>
                <button id="theme-toggle" class="theme-btn" aria-label="Toggle Dark Mode">
                    <!-- Icon injected by JS -->
                </button>
            </div>
            <h1 data-i18n="title">Find Matching Colors</h1>
            <p class="subtitle" data-i18n="subtitle">Pick a base color to see beautiful combinations</p>
            
            <div class="input-group">
                <div class="input-wrapper">
                    <div class="color-preview" id="color-preview">
                        <input type="color" id="color-picker" value="#3a86ff">
                    </div>
                    <input type="text" id="hex-input" value="#3A86FF" maxlength="7">
                </div>
                <button id="copy-base-btn" class="copy-btn" aria-label="Copy Color">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                </button>
            </div>
        </div>
    </header>

    <main class="container">
        <div id="grid" class="color-grid">
            <!-- Cards will be injected here -->
        </div>
    </main>

    <div id="toast" class="toast">Copied to clipboard!</div>

    <script src="main.js" type="module"></script>
</body>
</html>
